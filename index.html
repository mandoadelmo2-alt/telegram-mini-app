<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجربة Telegram Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px;
      background: #f2f2f2;
    }

    h1 {
      margin-bottom: 25px;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 15px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #cameraBtn {
      background: #2196f3;
      color: white;
    }

    #locationBtn {
      background: #4caf50;
      color: white;
    }

    video {
      width: 90%;
      max-width: 400px;
      margin-top: 20px;
      border-radius: 15px;
      display: none;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>🧪 تجربة الجهاز</h1>

  <button id="cameraBtn">📷 اختبار الكاميرا</button>

  <button id="locationBtn">📍 اختبار الموقع</button>

  <video id="camera" autoplay playsinline></video>

  <div id="result">
    النتيجة ستظهر هنا
  </div>

  <script>
    const cameraBtn = document.getElementById("cameraBtn");
    const locationBtn = document.getElementById("locationBtn");
    const camera = document.getElementById("camera");
    const result = document.getElementById("result");

    // اختبار الكاميرا
    cameraBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true
        });

        camera.srcObject = stream;
        camera.style.display = "block";

        result.innerHTML = "✅ تم السماح باستخدام الكاميرا.";
      } catch (error) {
        result.innerHTML =
          "❌ لم يتم السماح بالكاميرا أو أن الجهاز لا يدعمها.";
      }
    });

    // اختبار الموقع
    locationBtn.addEventListener("click", () => {

      if (!navigator.geolocation) {
        result.innerHTML = "❌ الموقع غير مدعوم على هذا الجهاز.";
        return;
      }

      result.innerHTML = "⏳ جاري طلب إذن الموقع...";

      navigator.geolocation.getCurrentPosition(
        (position) => {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          result.innerHTML =
            "✅ تم السماح بالموقع<br><br>" +
            "خط العرض: " + latitude +
            "<br>" +
            "خط الطول: " + longitude;
        },

        () => {
          result.innerHTML =
            "❌ لم يتم السماح بالوصول إلى الموقع.";
        }
      );
    });
  </script>

</body>
</html>
